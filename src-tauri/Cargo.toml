[package]
name = "vortex"
version = "1.1.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vortex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
regex = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
urlencoding = "2"
sysinfo = "0.33"
matroska = "0.30"
mp4 = "0.14"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "8"
notify-debouncer-mini = "0.6"
librqbit = { version = "9", default-features = false, features = ["http-api", "tracing-subscriber-utils"] }
# SHA-1 via the Windows crypto API and TLS via schannel: keeps aws-lc-sys (needs CMake + NASM) out of the build.
librqbit-core = { version = "9", default-features = false, features = ["sha1-crypto-hash"] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
librqbit-dualstack-sockets = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind rather than abort: a panic in one background task then kills that
# task instead of the whole app. Line tables are kept so the backtrace in
# crash.log names a file and line. Both cost binary size and can be tightened
# again once the crash reports stop arriving.
panic = "unwind"
debug = "line-tables-only"
strip = false
